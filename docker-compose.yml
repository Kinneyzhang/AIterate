services:
  aiterate:
    build: .
    container_name: aiterate
    restart: unless-stopped
    ports:
      - "7070:7070"
    volumes:
      # SQLite 模式：持久化数据文件
      - ./data:/data
      # 配置文件（LLM key 等存 DB；db.json 需提前准备）
      - ./config:/app/config
    environment:
      - TZ=Asia/Shanghai

