<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIterate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/assets/fonts.css">
  <link rel="stylesheet" href="/assets/app.css">
  <link rel="stylesheet" id="themeStylesheet" href="/assets/themes/night.css">
  <link rel="stylesheet" id="themeStylesheetAlt" href="/assets/themes/mono.css" disabled>
  <script>
    (function () {
    try {
      const t = localStorage.getItem('learn-system-theme') || 'night';
      document.documentElement.dataset.theme = t;
      // 预加载两套主题，切换时只改 disabled，避免重新加载 CSS 导致抖动
      const main = document.getElementById('themeStylesheet');
      const alt  = document.getElementById('themeStylesheetAlt');
      if (t === 'mono') {
        main.href = '/assets/themes/mono.css'; main.disabled = false;
        alt.href  = '/assets/themes/night.css'; alt.disabled = true;
      }
    } catch (_) {}
    // 初始化主题按钮图标（DOMContentLoaded 后执行）
    document.addEventListener('DOMContentLoaded', function () {
      const t = document.documentElement.dataset.theme || 'night';
      const btn = document.getElementById('themeToggleBtn');
      if (btn) btn.textContent = t === 'mono' ? '☀️' : '🌙';
    });
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css" id="hljs-theme-light">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css" id="hljs-theme-dark" disabled>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/highlight.min.js"></script>
  <script>
    // 配置 marked 使用 highlight.js
    document.addEventListener('DOMContentLoaded', function () {
      if (window.marked && window.hljs) {
        marked.setOptions({
          highlight: function (code, lang) {
            if (lang && hljs.getLanguage(lang)) {
              return hljs.highlight(code, { language: lang }).value;
            }
            return hljs.highlightAuto(code).value;
          }
        });
      }
    });
    // 跟随主题切换 hljs css
    function syncHljsTheme(theme) {
      document.getElementById('hljs-theme-light').disabled = (theme !== 'mono');
      document.getElementById('hljs-theme-dark').disabled  = (theme === 'mono');
    }
    try {
      syncHljsTheme(localStorage.getItem('learn-system-theme') || 'night');
    } catch (_) {}
  </script>
</head>
<body>

  <!-- ── topbar ───────────────────────────────────────────────────────────── -->
  <header class="topbar">
    <div class="topbar-title">📚 AIterate</div>
    <div class="topbar-actions">
      <button class="btn btn-sm" title="设置" onclick="window.app.openSettings()">⚙️</button>
      <button class="btn btn-icon" title="新建问题/观点" onclick="window.app.openNewSession()">＋</button>
      <button class="btn btn-sm" id="themeToggleBtn" onclick="window.app.toggleTheme()" title="切换主题">🌙</button>
    </div>
  </header>

  <!-- ── layout ───────────────────────────────────────────────────────────── -->
  <div class="workspace-shell">

    <!-- sidebar -->
    <aside class="sidebar" id="sessionSidebar">
      <div class="sidebar-head">
        <div class="sidebar-head-row">
          <div class="sidebar-title">会话 </div>
          <span id="sessionStats" class="sidebar-stat"></span>
          <button class="btn btn-icon sidebar-toggle" id="sidebarToggle" title="折叠/展开" onclick="window.app.toggleSidebar()">☰</button>
        </div>
      </div>
      <div class="session-list" id="sessionList">
        <div class="sidebar-empty">加载中…</div>
      </div>
      <div class="sidebar-resizer" id="sidebarResizer"></div>
    </aside>

    <!-- main -->
    <main class="main-pane">

      <!-- notice bar -->
      <div id="noticeBar" class="notice-bar"></div>

      <!-- workspace -->
      <div id="workspacePanel">
        <div class="empty-state">
          <div class="empty-icon">💡</div>
          <h3>从左侧选一个 session，或点 ＋ 新建</h3>
          <p>每个问题 / 观点都是独立迭代单元，经过三个阶段走向完成。</p>
        </div>
      </div>

    </main>
  </div>

  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
