<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIterate</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/assets/fonts.css">
  <link rel="stylesheet" href="/assets/app.css">
  <link rel="stylesheet" href="/assets/themes/night.css">
  <link rel="stylesheet" href="/assets/themes/mono.css">
  <link rel="stylesheet" href="/vendor/github.min.css" id="hljs-theme-light">
  <link rel="stylesheet" href="/vendor/github-dark.min.css" id="hljs-theme-dark" disabled>
  <script>
    (function () {
      try {
        const t = localStorage.getItem('aiterate-theme') || 'night';
        document.documentElement.dataset.theme = t;
      } catch (_) {}
      document.addEventListener('DOMContentLoaded', function () {
        const t = document.documentElement.dataset.theme || 'night';
        syncHljsTheme(t);
      });
    })();
  </script>
  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/purify.min.js"></script>
  <script src="/vendor/highlight.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (window.marked && window.hljs) {
        marked.setOptions({
          highlight: function (code, lang) {
            if (lang && hljs.getLanguage(lang)) return hljs.highlight(code, { language: lang }).value;
            return hljs.highlightAuto(code).value;
          }
        });
      }
    });
    function syncHljsTheme(theme) {
      document.getElementById('hljs-theme-light').disabled = (theme !== 'mono');
      document.getElementById('hljs-theme-dark').disabled  = (theme === 'mono');
    }
  </script>
</head>
<body>
  <div id="app"><!-- Vue mounts here --></div>
  <script>window.AITERATE_TOKEN="%%AITERATE_TOKEN%%";</script>
  <script type="module" src="/assets/js/vue/main.js"></script>
</body>
</html>
